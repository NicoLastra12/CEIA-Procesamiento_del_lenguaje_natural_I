[project]
name = "ceia-procesamiento-del-lenguaje-natural-i"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
 
# Librerías que usan los desafíos (las versiones exactas quedan en uv.lock)
dependencies = [
    "gensim>=4.4",
    "matplotlib>=3.9",
    "nltk>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]
 
[dependency-groups]
dev = [
    "ipykernel>=6.29",
]
# Redes neuronales (desafíos 3 en adelante). Se instala con: uv sync --group deep
deep = [
    "tensorflow>=2.18",
]
 
# El repo no es un paquete instalable: las funciones viven dentro de cada notebook
[tool.uv]
package = false
default-groups = ["dev"]
 